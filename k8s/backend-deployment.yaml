# Kubernetes Deployment Configuration - Backend Spring Boot

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agri-backend
  labels:
    app: agri-backend
spec:
  replicas: 1  # ⭐ Nombre de pods (augmenter à 3-5 pour haute disponibilité)
  selector:
    matchLabels:
      app: agri-backend  # ⭐ Kubernetes sélectionne les pods avec ce label
  template:
    metadata:
      labels:
        app: agri-backend
      # ⭐ Vault injecte les secrets (password, clés API) sans les exposer
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "agri-backend-role"
        vault.hashicorp.com/agent-inject-secret-application.properties: "secret/data/agri/db"
        vault.hashicorp.com/agent-inject-template-application.properties: |
          {{- with secret "secret/data/agri/db" -}}
          spring.data.mongodb.uri=mongodb://{{ .Data.data.username }}:{{ .Data.data.password }}@agri-mongodb:27017/agricultural_marketplace?authSource=admin
          server.port=8080
          {{- end }}
    spec:
      serviceAccountName: agri-backend-sa  # Service Account pour accès Vault
      containers:
      - name: agri-backend
        image: agri-backend:latest  # ⭐ Image Docker (construite par Jenkins)
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_CONFIG_ADDITIONAL_LOCATION
          value: "file:/vault/secrets/application.properties"  # ⭐ Config injectée par Vault
        ports:
        - containerPort: 8080  # ⭐ Port Spring Boot
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:  # ⭐ Redémarre le pod s'il n'est pas vivant
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:  # ⭐ Route le trafic seulement si le pod est prêt
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
---
# Service expose le Deployment sur le réseau
apiVersion: v1
kind: Service
metadata:
  name: agri-backend
spec:
  selector:
    app: agri-backend  # ⭐ Route vers les pods avec ce label
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort  # ⭐ Expose sur chaque nœud du cluster
